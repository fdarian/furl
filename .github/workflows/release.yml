name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".changeset/**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: "https://registry.npmjs.org"

      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run ci:version
          publish-script: bun run ci:release
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find furl-cli version
        id: furl-cli
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(jq -r '.[] | select(.name == "furl-cli") | .version' <<< "$PUBLISHED_PACKAGES")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}

      - name: Build binaries
        if: steps.furl-cli.outputs.version != ''
        run: cd apps/cli && pnpm run build:binaries

      - name: Upload release assets
        if: steps.furl-cli.outputs.version != ''
        run: |
          TAG="furl-cli@${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Release $VERSION"
          gh release upload "$TAG" apps/cli/dist/releases/*.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.furl-cli.outputs.version }}

      - name: Update Homebrew formula
        if: steps.furl-cli.outputs.version != ''
        run: cd apps/cli && bun run scripts/update-homebrew.ts
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.furl-cli.outputs.version }}
